      <text x="270" y="34" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#06b6d4" text-anchor="middle">AB</text>
      <text x="292" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">ABUAD Computer Science</text>
      <text x="292" y="39" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#06b6d4">Campus Discord</text>
      <text x="256" y="66" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Algorithm study groups, project pairing &amp; dev hackathons.</text>
      <circle cx="262" cy="85" r="3" fill="#10b981"/>
      <text x="270" y="88" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#10b981">420 members active</text>

      <!-- Card 3 -->
      <g transform="translate(0, 110)">
