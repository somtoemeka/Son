<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091122"/>
      <stop offset="50%" stop-color="#0d1b32"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="crAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="crCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13233f"/>
      <stop offset="100%" stop-color="#0f192b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#crBg)"/>

  <!-- Main Container Card -->
  <g transform="translate(45, 30)">
    <!-- Header with Search -->
    <rect width="510" height="340" rx="16" fill="#0d172c" stroke="#1d2f4e" stroke-width="2"/>
    
    <!-- Top Bar -->
    <rect width="510" height="56" rx="16 16 0 0" fill="#080f1e" stroke="#182742" stroke-width="1"/>
    <text x="24" y="34" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Commonroom</text>
    
    <!-- Search Bar -->
    <rect x="180" y="14" width="230" height="28" rx="14" fill="#12203a" stroke="#253b61" stroke-width="1"/>
    <circle cx="196" cy="28" r="4" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <line x1="199" y1="31" x2="204" y2="36" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="214" y="32" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#94a3b8">Search developer communities...</text>
    
    <rect x="424" y="14" width="70" height="28" rx="14" fill="url(#crAccent)"/>
    <text x="459" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#080f1e" text-anchor="middle">+ Add Hub</text>

    <!-- Category Filter Pills -->
    <g transform="translate(24, 70)">
      <rect width="50" height="22" rx="11" fill="#10b981" opacity="0.2"/>
      <text x="25" y="15" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#10b981" text-anchor="middle">All (148)</text>

      <rect x="58" width="60" height="22" rx="11" fill="#101c30" stroke="#1e3252" stroke-width="1"/>
      <text x="88" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Flutter / Dart</text>

      <rect x="126" width="72" height="22" rx="11" fill="#101c30" stroke="#1e3252" stroke-width="1"/>
      <text x="162" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Nigeria Tech</text>

      <rect x="206" width="76" height="22" rx="11" fill="#101c30" stroke="#1e3252" stroke-width="1"/>
      <text x="244" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Web &amp; React</text>

      <rect x="290" width="78" height="22" rx="11" fill="#101c30" stroke="#1e3252" stroke-width="1"/>
      <text x="329" y="15" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">ABUAD Campus</text>
