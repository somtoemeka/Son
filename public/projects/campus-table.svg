<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322"/>
      <stop offset="50%" stop-color="#0e1d34"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="ctAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ctCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142644"/>
      <stop offset="100%" stop-color="#101d32"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#ctBg)"/>

  <!-- Desktop Ordering App Frame -->
  <g transform="translate(45, 30)">
    <rect width="510" height="340" rx="16" fill="#0d182b" stroke="#1f3659" stroke-width="2"/>
    
    <!-- Topbar -->
    <rect width="510" height="52" rx="16 16 0 0" fill="#091120" stroke="#162742" stroke-width="1"/>
    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Campus Table</text>
    <rect x="135" y="20" width="100" height="18" rx="9" fill="#10b981" opacity="0.15"/>
    <text x="185" y="32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="9" fill="#10b981" text-anchor="middle">ABUAD CAFETERIA</text>

    <!-- Student User Pill -->
    <rect x="360" y="16" width="130" height="24" rx="12" fill="#12233f"/>
    <circle cx="374" cy="28" r="7" fill="#10b981"/>
    <text x="374" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="9" fill="#091120" text-anchor="middle">SC</text>
    <text x="388" y="32" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#f8fafc">Somto C. (Student)</text>

    <!-- Main Content Area: Menu Items Left (320px), Cart Right (160px) -->
    <g transform="translate(24, 70)">
      <!-- Left Menu Header -->
      <text x="0" y="14" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Fresh Campus Meals</text>
      
      <!-- Food Item 1 -->
      <g transform="translate(0, 26)">
        <rect width="300" height="66" rx="10" fill="url(#ctCardGrad)" stroke="#22395d" stroke-width="1"/>
        <rect x="12" y="10" width="46" height="46" rx="8" fill="#182d4d"/>
        <text x="35" y="38" font-size="22" text-anchor="middle">🍲</text>
        <text x="68" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Special Jollof &amp; Grilled Chicken</text>
        <text x="68" y="40" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Spiced fried plantain, coleslaw &amp; pepper sauce</text>
        <text x="68" y="56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#10b981">₦2,500</text>
        <rect x="238" y="34" width="50" height="22" rx="6" fill="url(#ctAccent)"/>
        <text x="263" y="48" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#080e1a" text-anchor="middle">+ Add</text>
      </g>

      <!-- Food Item 2 -->
      <g transform="translate(0, 102)">
        <rect width="300" height="66" rx="10" fill="url(#ctCardGrad)" stroke="#22395d" stroke-width="1"/>
        <rect x="12" y="10" width="46" height="46" rx="8" fill="#182d4d"/>
        <text x="35" y="38" font-size="22" text-anchor="middle">🍝</text>
        <text x="68" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Creamy Pasta &amp; Shredded Beef</text>
        <text x="68" y="40" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Garlic cream sauce, sweet peppers</text>
        <text x="68" y="56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#10b981">₦2,200</text>
        <rect x="238" y="34" width="50" height="22" rx="6" fill="#1b3052" stroke="#2c4b79" stroke-width="1"/>
        <text x="263" y="48" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">Added ✓</text>
      </g>

      <!-- Food Item 3 -->
      <g transform="translate(0, 178)">
        <rect width="300" height="66" rx="10" fill="url(#ctCardGrad)" stroke="#22395d" stroke-width="1"/>
        <rect x="12" y="10" width="46" height="46" rx="8" fill="#182d4d"/>
        <text x="35" y="38" font-size="22" text-anchor="middle">🥤</text>
        <text x="68" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Chilled Tropical Fruit Smoothie</text>
        <text x="68" y="40" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Pineapple, watermelon, fresh ginger</text>
        <text x="68" y="56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#10b981">₦1,000</text>
        <rect x="238" y="34" width="50" height="22" rx="6" fill="url(#ctAccent)"/>
        <text x="263" y="48" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#080e1a" text-anchor="middle">+ Add</text>
      </g>
    </g>

    <!-- Right Cart Drawer Mockup -->
    <g transform="translate(345, 70)">
      <rect width="145" height="245" rx="12" fill="#091222" stroke="#1d3457" stroke-width="1"/>
      <text x="14" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Your Tray (2 items)</text>
      
      <text x="14" y="52" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Creamy Pasta x1</text>
      <text x="131" y="52" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#f8fafc" text-anchor="end">₦2,200</text>

      <text x="14" y="72" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Zobo / Lemon x1</text>
      <text x="131" y="72" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#f8fafc" text-anchor="end">₦600</text>

      <line x1="14" y1="92" x2="131" y2="92" stroke="#1d3457"/>
      
      <text x="14" y="112" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#f8fafc">Total</text>
      <text x="131" y="112" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#10b981" text-anchor="end">₦2,800</text>

      <!-- Monnify Gateway Badge -->
      <rect x="14" y="132" width="117" height="34" rx="8" fill="#0f1f38" stroke="#1e3a63" stroke-width="1"/>
      <text x="22" y="146" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#94a3b8">Payment Gateway</text>
      <text x="22" y="159" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#06b6d4">⚡ Monnify Checkout</text>

      <!-- Order Button -->
      <rect x="14" y="180" width="117" height="30" rx="8" fill="url(#ctAccent)"/>
      <text x="72" y="199" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#070d18" text-anchor="middle">Pay &amp; Pickup</text>

      <circle cx="20" cy="228" r="3" fill="#10b981"/>
      <text x="28" y="231" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#10b981">ABUAD Hall 3 Pickup</text>
    </g>
  </g>
</svg>