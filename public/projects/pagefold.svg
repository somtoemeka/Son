<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09121d"/>
      <stop offset="50%" stop-color="#0c1827"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="pfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#pfBg)"/>

  <!-- Center Mobile Viewfinder Mockup -->
  <g transform="translate(195, 30)">
    <rect width="210" height="345" rx="34" fill="#080e16" stroke="#1c2f47" stroke-width="3"/>
    <rect x="7" y="7" width="196" height="331" rx="27" fill="#0a1522"/>
    
    <!-- Notch -->
    <rect x="68" y="15" width="60" height="10" rx="5" fill="#080e16"/>

    <!-- Header -->
    <text x="24" y="48" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Pagefold</text>
    <rect x="142" y="38" width="40" height="15" rx="7.5" fill="#10b981" opacity="0.2"/>
    <text x="162" y="49" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="8" fill="#10b981" text-anchor="middle">OCR AUTO</text>

    <!-- Camera Viewfinder with Target Document -->
    <rect x="18" y="65" width="160" height="190" rx="14" fill="#070f1a" stroke="#182c44" stroke-width="1"/>
    
    <!-- Optical Scanner Corner Reticles -->
    <path d="M 28 85 L 28 75 L 38 75" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 168 75 L 178 75 L 178 85" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 28 235 L 28 245 L 38 245" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 168 245 L 178 245 L 178 235" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Document in scan area -->
    <g transform="translate(38, 85)">
      <rect width="120" height="150" rx="6" fill="#132338" stroke="#253e5e" stroke-width="1"/>
      <rect x="12" y="14" width="60" height="6" rx="3" fill="#10b981"/>
      <rect x="12" y="28" width="96" height="4" rx="2" fill="#3a587d"/>
      <rect x="12" y="38" width="96" height="4" rx="2" fill="#3a587d"/>
      <rect x="12" y="48" width="80" height="4" rx="2" fill="#3a587d"/>
      <rect x="12" y="58" width="88" height="4" rx="2" fill="#3a587d"/>
      
      <!-- Scan Beam Line -->
      <line x1="0" y1="80" x2="120" y2="80" stroke="#06b6d4" stroke-width="2"/>
      <rect x="0" y="60" width="120" height="20" fill="url(#pfAccent)" opacity="0.15"/>

      <rect x="12" y="100" width="40" height="30" rx="4" fill="#091524"/>
      <rect x="60" y="100" width="48" height="6" rx="3" fill="#3a587d"/>
      <rect x="60" y="112" width="36" height="4" rx="2" fill="#3a587d"/>
      <rect x="60" y="122" width="42" height="4" rx="2" fill="#3a587d"/>
    </g>

    <!-- Scan Controls -->
    <circle cx="98" cy="285" r="22" stroke="#10b981" stroke-width="2" fill="none"/>
    <circle cx="98" cy="285" r="17" fill="url(#pfAccent)"/>
    
    <text x="36" y="289" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Gallery</text>
    <text x="160" y="289" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">Flash On</text>
  </g>

  <!-- Left Stats Card -->
  <g transform="translate(30, 130)">
    <rect width="135" height="95" rx="14" fill="#0e1a2b" stroke="#1d3452" stroke-width="1"/>
    <text x="18" y="30" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#10b981">CONVERSION SPEED</text>
    <text x="18" y="56" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#f8fafc">0.8s</text>
    <text x="18" y="74" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">On-device PDF engine</text>
  </g>

  <!-- Right Defense Card -->
  <g transform="translate(435, 170)">
    <rect width="135" height="95" rx="14" fill="#0e1a2b" stroke="#1d3452" stroke-width="1"/>
    <text x="18" y="30" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="10" fill="#06b6d4">EXPORT FORMATS</text>
    <text x="18" y="56" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18" fill="#f8fafc">PDF · DOCX</text>
    <text x="18" y="76" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Zero cloud dependency</text>
  </g>
</svg>