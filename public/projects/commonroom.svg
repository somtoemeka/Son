        <rect width="220" height="98" rx="12" fill="url(#crCardGrad)" stroke="#223961" stroke-width="1"/>
        <circle cx="28" cy="30" r="14" fill="#fbbf24" opacity="0.2"/>
        <text x="28" y="34" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#fbbf24" text-anchor="middle">UI</text>
        <text x="50" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">UI/UX &amp; Frontend Hub</text>
        <text x="50" y="39" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#fbbf24">WhatsApp Community</text>
        <text x="14" y="66" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Design critique, interactive demos, Tailwind CSS &amp; animations.</text>
        <circle cx="20" cy="85" r="3" fill="#10b981"/>
        <text x="28" y="88" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#10b981">610 members active</text>
