        <circle cx="28" cy="30" r="14" fill="#818cf8" opacity="0.2"/>
        <text x="28" y="34" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#818cf8" text-anchor="middle">BE</text>
        <text x="50" y="26" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Backend &amp; Cloud Africa</text>
        <text x="50" y="39" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#818cf8">Telegram Group</text>
        <text x="14" y="66" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">REST APIs, Firebase, Node, database scaling &amp; cloud architecture.</text>
        <circle cx="20" cy="85" r="3" fill="#10b981"/>
        <text x="28" y="88" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#10b981">950 members active</text>
