<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#0e1a2d"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="dmPhone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142138"/>
      <stop offset="100%" stop-color="#0d1626"/>
    </linearGradient>
    <linearGradient id="dmAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dmCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a47"/>
      <stop offset="100%" stop-color="#121d33"/>
    </linearGradient>
    <filter id="dmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#dmBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="140" fill="#10b981" opacity="0.12" filter="url(#dmGlow)"/>
  <circle cx="480" cy="120" r="90" fill="#06b6d4" opacity="0.1" filter="url(#dmGlow)"/>

  <!-- Mobile Frame Center Mockup -->
  <g transform="translate(190, 30)">
    <!-- Phone Outer Body -->
    <rect width="220" height="345" rx="36" fill="#080d16" stroke="#223354" stroke-width="3"/>
    <!-- Screen -->
    <rect x="8" y="8" width="204" height="329" rx="28" fill="url(#dmPhone)"/>
    
    <!-- Notch / Island -->
    <rect x="70" y="16" width="64" height="12" rx="6" fill="#080d16"/>
    
    <!-- Header App Bar -->
    <text x="24" y="52" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#f8fafc">Daymark</text>
    <rect x="156" y="42" width="28" height="14" rx="7" fill="#10b981" opacity="0.2"/>
    <text x="170" y="52" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="8" fill="#10b981" text-anchor="middle">LIVE</text>

    <!-- Ritual Capsule Progress Card -->
    <rect x="20" y="68" width="164" height="68" rx="14" fill="url(#dmCard)" stroke="#273d66" stroke-width="1"/>
    <text x="32" y="88" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#94a3b8">Active Ritual</text>
    <text x="32" y="104" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#f8fafc">Letter to 2027</text>
    <rect x="32" y="116" width="140" height="6" rx="3" fill="#0b1320"/>
    <rect x="32" y="116" width="98" height="6" rx="3" fill="url(#dmAccent)"/>

    <!-- Memory Capsule 1 -->
    <rect x="20" y="146" width="164" height="52" rx="12" fill="#111c30" stroke="#1f3050" stroke-width="1"/>
    <circle cx="38" cy="172" r="10" fill="#10b981" opacity="0.2"/>
    <circle cx="38" cy="172" r="4" fill="#10b981"/>
    <text x="56" y="168" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#f8fafc">ABUAD Milestones</text>
    <text x="56" y="182" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#64748b">Unlocks in 184 days</text>

    <!-- Memory Capsule 2 -->
    <rect x="20" y="206" width="164" height="52" rx="12" fill="#111c30" stroke="#1f3050" stroke-width="1"/>
    <circle cx="38" cy="232" r="10" fill="#06b6d4" opacity="0.2"/>
    <circle cx="38" cy="232" r="4" fill="#06b6d4"/>
    <text x="56" y="228" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="10" fill="#f8fafc">First Mobile App</text>
    <text x="56" y="242" font-family="'Space Grotesk', sans-serif" font-size="8" fill="#64748b">Encrypted offline</text>

    <!-- Bottom Action Button -->
    <rect x="20" y="272" width="164" height="34" rx="10" fill="url(#dmAccent)"/>
    <text x="102" y="293" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#080d16" text-anchor="middle">+ Schedule Memory</text>
  </g>

  <!-- Floating Left Card -->
  <g transform="translate(35, 110)">
    <rect width="130" height="90" rx="14" fill="#101b2f" stroke="#223659" stroke-width="1" opacity="0.95"/>
    <circle cx="30" cy="30" r="14" fill="#10b981" opacity="0.15"/>
    <path d="M25 30 L29 34 L36 26" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="52" y="34" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">Local Sync</text>
    <text x="20" y="60" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Encrypted storage</text>
    <rect x="20" y="70" width="70" height="4" rx="2" fill="#10b981"/>
  </g>

  <!-- Floating Right Card -->
  <g transform="translate(435, 200)">
    <rect width="135" height="95" rx="14" fill="#101b2f" stroke="#223659" stroke-width="1" opacity="0.95"/>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#06b6d4">Ritual Streak</text>
    <text x="20" y="58" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="22" fill="#f8fafc">42 Days</text>
    <text x="20" y="78" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">Consistent reflections</text>
  </g>
</svg>